<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône dupot (coin orange + « d » + cercle en dégradé, cf. les autres jeux
     et dupotDevTools) avec le pictogramme de Little Escape : la porte de sortie
     entrouverte et sa clé. Le « d » est un tracé (pas de <text>) pour être rendu
     par Godot (tools/icons/generate_icons.gd). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 148.09265 148.21524">
  <defs>
    <linearGradient id="circle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e1f5"/>
    </linearGradient>
  </defs>

  <rect x="64.941448" y="0" width="83.151207" height="83.151207" rx="8.9396687" fill="#ee5f00"/>
  <circle cx="74.04" cy="74.11" r="74.05" fill="url(#circle)"/>
  <!-- « d » -->
  <g fill="#ffffff">
    <rect x="139.4" y="5.2" width="3.9" height="19.6" rx="0.8"/>
    <path fill-rule="evenodd" d="M141.2 17.6 A6.3 6.6 0 1 0 128.6 17.6 A6.3 6.6 0 1 0 141.2 17.6 Z M137.5 17.6 A2.6 3.1 0 1 0 132.3 17.6 A2.6 3.1 0 1 0 137.5 17.6 Z"/>
  </g>

  <!-- porte entrouverte et clé (repris de l'ancienne icône) -->
  <g transform="translate(-6 4) scale(0.56)">
    <!-- encadrement et ouverture (lumière de la sortie) -->
    <rect x="64" y="40" width="112" height="160" fill="#c77d4d" stroke="#120d1a" stroke-width="8" stroke-linejoin="round"/>
    <rect x="78" y="54" width="84" height="146" fill="#fff6d8" stroke="#120d1a" stroke-width="6"/>
    <!-- battant -->
    <path d="M78 54 L128 66 L128 194 L78 200 Z" fill="#e8945c" stroke="#120d1a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M90 76 L118 82 L118 120 L90 118 Z" fill="#c77d4d" stroke="#120d1a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M90 134 L118 134 L118 176 L90 180 Z" fill="#c77d4d" stroke="#120d1a" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="120" cy="130" r="6" fill="#ffcc2e" stroke="#120d1a" stroke-width="4"/>
    <!-- sol -->
    <path d="M40 200 H200" stroke="#120d1a" stroke-width="8" stroke-linecap="round"/>
    <!-- clé -->
    <g transform="rotate(-35 186 170)">
      <circle cx="160" cy="170" r="24" fill="#ffcc2e" stroke="#120d1a" stroke-width="8"/>
      <circle cx="160" cy="170" r="9" fill="#ffffff" stroke="#120d1a" stroke-width="6"/>
      <path d="M182 162 H236 V178 H226 V194 H212 V178 H204 V190 H190 V178 H182 Z" fill="#ffcc2e" stroke="#120d1a" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
